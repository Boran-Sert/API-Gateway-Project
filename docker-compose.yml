version: '3.8'

services:
  # --- 1. GATEWAY & MONITORING ---
  dispatcher:
    build: ./dispatcher
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo-dispatcher:27017
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - PRODUCT_SERVICE_URL=http://product-service:8003
      - REDIS_HOST=redis-cache  # Container name ile aynı olmalı
      - REDIS_PORT=6379
    depends_on:
      - mongo-dispatcher
      - redis
    networks:
      - micro-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - micro-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - micro-network
    depends_on:
      - prometheus

  # --- 2. AUTH & SESSION ---
  auth-service:
    build:
      context: ./auth-service # Context'i direkt klasöre verdik
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - MONGO_URL=mongodb://mongo-auth:27017
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    depends_on:
      - mongo-auth
      - redis
    networks:
      - micro-network

  redis:
    image: redis:alpine
    container_name: redis-cache
    networks:
      - micro-network

  # --- 3. BUSINESS LOGIC ---
  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      - MONGO_URL=mongodb://mongo-product:27017
    depends_on:
      - mongo-product
    networks:
      - micro-network

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      - MONGO_URL=mongodb://mongo-user:27017
    depends_on:
      - mongo-user
    networks:
      - micro-network

  # --- 4. DATA PERSISTENCE ---
  mongo-dispatcher:
    image: mongo:latest
    container_name: mongo-dispatcher
    networks:
      - micro-network

  mongo-product:
    image: mongo:latest
    container_name: mongo-product
    networks:
      - micro-network

  mongo-user:
    image: mongo:latest
    container_name: mongo-user
    networks:
      - micro-network

  mongo-auth:
    image: mongo:latest
    container_name: mongo-auth
    volumes:
      - mongo_auth_data:/data/db
    networks:
      - micro-network

networks:
  micro-network:
    driver: bridge

volumes:
  mongo_auth_data:
  mongo_product_data: