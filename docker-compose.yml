version: '3.8'

services:
  dispatcher:
    build:
      context: .
      dockerfile: dispatcher/Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo-dispatcher:27017
      - AUTH_SERVICE_URL=http://auth-service:8000
      - USER_SERVICE_URL=http://user-service:8002
      - PRODUCT_SERVICE_URL=http://product-service:8003
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    depends_on:
      - mongo-dispatcher
      - redis
    networks:
      - micro-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - micro-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - micro-network
    depends_on:
      - prometheus

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    environment:
      - MONGO_URL=mongodb://mongo-auth:27017
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    depends_on:
      - mongo-auth
      - redis
    networks:
      - micro-network
    ports:
      - "8001:8000"

  redis:
    image: redis:alpine
    container_name: redis-cache
    networks:
      - micro-network

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    ports:
      - "8003:8003"
    environment:
      - MONGO_URL=mongodb://mongo-product:27017
    depends_on:
      - mongo-product
    networks:
      - micro-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8002:8002"
    environment:
      - MONGO_URL=mongodb://mongo-user:27017
    depends_on:
      - mongo-user
    networks:
      - micro-network

  # --- 4. DATA PERSISTENCE ---
  mongo-dispatcher:
    image: mongo:latest
    container_name: mongo-dispatcher
    ports:
      - "27020:27017" # Gateway DB
    networks:
      - micro-network

  mongo-product:
    image: mongo:latest
    container_name: mongo-product
    ports:
      - "27019:27017" # Ürünler DB
    volumes:
      - mongo_product_data:/data/db
    networks:
      - micro-network

  mongo-user:
    image: mongo:latest
    container_name: mongo-user
    ports:
      - "27018:27017" # Kullanıcılar DB
    volumes:
      - mongo_user_data:/data/db
    networks:
      - micro-network

  mongo-auth:
    image: mongo:latest
    container_name: mongo-auth
    ports:
      - "27017:27017" # Auth DB
    volumes:
      - mongo_auth_data:/data/db
    networks:
      - micro-network

networks:
  micro-network:
    driver: bridge

volumes:
  mongo_auth_data:
  mongo_product_data:
  mongo_user_data:
